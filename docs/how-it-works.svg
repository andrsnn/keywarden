<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 500" width="910" height="500" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .bad { fill: #fff1f0; stroke: #d1242f; }
    .good { fill: #effaf3; stroke: #1a7f37; }
    .vault { fill: #eef4ff; stroke: #0969da; }
    .pref { fill: #ffffff; stroke: #0969da; }
    .alt { fill: #ffffff; stroke: #d0d7de; }
    .badh { fill: #d1242f; }
    .goodh { fill: #1a7f37; }
    .blueh { fill: #0969da; }
    .arrow { stroke: #59636e; fill: none; stroke-width: 2; }
    .head { fill: #59636e; }
    .code { font-family: ui-monospace, Consolas, Menlo, monospace; font-size: 13px; fill: #1f2328; }
    .chip { fill: #f6f8fa; stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .t, .code { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .bad { fill: #2d1517; stroke: #f85149; }
      .good { fill: #12261b; stroke: #3fb950; }
      .vault { fill: #121d2f; stroke: #4493f8; }
      .pref { fill: #0d1117; stroke: #4493f8; }
      .alt { fill: #0d1117; stroke: #3d444d; }
      .badh { fill: #f85149; }
      .goodh { fill: #3fb950; }
      .blueh { fill: #4493f8; }
      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .chip { fill: #161b22; stroke: #3d444d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" class="head"/>
    </marker>
  </defs>
  <rect class="bg" width="910" height="500" rx="12"/>

  <!-- Without -->
  <text x="30" y="40" font-size="15" font-weight="700" class="badh">Without keywarden</text>
  <rect class="bad" x="30" y="56" width="250" height="74" rx="10" stroke-width="1.5"/>
  <text x="155" y="88" font-size="15" text-anchor="middle" class="t">You paste the key</text>
  <text x="155" y="110" font-size="15" text-anchor="middle" class="t">into Claude</text>
  <path class="arrow" d="M282 93 H328" marker-end="url(#a)"/>
  <rect class="bad" x="330" y="56" width="250" height="74" rx="10" stroke-width="1.5"/>
  <text x="455" y="88" font-size="15" text-anchor="middle" class="t">Claude copies it into files</text>
  <text x="455" y="110" font-size="15" text-anchor="middle" class="t">and its chat log</text>
  <path class="arrow" d="M582 93 H628" marker-end="url(#a)"/>
  <rect class="bad" x="630" y="56" width="250" height="74" rx="10" stroke-width="1.5"/>
  <text x="755" y="88" font-size="15" text-anchor="middle" class="t">The model provider</text>
  <text x="755" y="110" font-size="15" text-anchor="middle" class="t">receives it too</text>

  <!-- With -->
  <text x="30" y="185" font-size="15" font-weight="700" class="goodh">With keywarden</text>

  <rect class="good" x="30" y="201" width="250" height="190" rx="10" stroke-width="1.5"/>
  <text x="155" y="232" font-size="15" text-anchor="middle" class="t">You send one line:</text>
  <rect class="chip" x="44" y="244" width="222" height="30" rx="6"/>
  <text x="155" y="264" text-anchor="middle" class="code">key NAME value</text>
  <text x="155" y="298" font-size="14" text-anchor="middle" class="t">keywarden saves it before</text>
  <text x="155" y="318" font-size="14" text-anchor="middle" class="t">Claude sees it. Claude saves</text>
  <text x="155" y="338" font-size="14" text-anchor="middle" class="t">keys it makes with</text>
  <rect class="chip" x="44" y="348" width="222" height="30" rx="6"/>
  <text x="155" y="368" text-anchor="middle" class="code">... | keys add NAME</text>

  <path class="arrow" d="M282 296 H328" marker-end="url(#a)"/>

  <rect class="vault" x="330" y="201" width="250" height="190" rx="10" stroke-width="1.5"/>
  <text x="455" y="226" font-size="15" text-anchor="middle" font-weight="700" class="t">One key store, your pick</text>
  <rect class="pref" x="344" y="238" width="222" height="56" rx="8" stroke-width="1.5"/>
  <text x="455" y="261" font-size="14" text-anchor="middle" font-weight="700" class="blueh">1Password (preferred)</text>
  <text x="455" y="281" font-size="12.5" text-anchor="middle" class="m">Backed up and shared with your team</text>
  <path class="arrow" d="M455 300 V326" marker-start="url(#b)" marker-end="url(#a)"/>
  <rect class="chip" x="470" y="302" width="96" height="22" rx="5"/>
  <text x="518" y="317" text-anchor="middle" class="code" font-size="12">keys switch</text>
  <rect class="alt" x="344" y="330" width="222" height="52" rx="8" stroke-width="1.5"/>
  <text x="455" y="351" font-size="13.5" text-anchor="middle" font-weight="700" class="t">This computer's key store</text>
  <text x="455" y="370" font-size="12" text-anchor="middle" class="m">Credential Manager or Mac Keychain</text>

  <path class="arrow" d="M582 296 H628" marker-end="url(#a)"/>

  <rect class="good" x="630" y="201" width="250" height="190" rx="10" stroke-width="1.5"/>
  <text x="755" y="232" font-size="15" text-anchor="middle" class="t">Claude runs</text>
  <rect class="chip" x="644" y="244" width="222" height="30" rx="6"/>
  <text x="755" y="264" text-anchor="middle" class="code">keys grant NAME --for "..."</text>
  <text x="755" y="300" font-size="14" text-anchor="middle" class="t">For 12 hours, every command</text>
  <text x="755" y="320" font-size="14" text-anchor="middle" class="t">Claude runs gets those keys.</text>
  <text x="755" y="350" font-size="13" text-anchor="middle" class="m">Keys you protect wait for</text>
  <text x="755" y="368" font-size="13" text-anchor="middle" class="m">a tap on your phone.</text>

  <!-- What Claude sees -->
  <rect class="chip" x="30" y="414" width="850" height="64" rx="10"/>
  <text x="50" y="441" font-size="15" class="t">Claude only ever sees the name <tspan class="code" font-size="15">OPENAI_API_KEY</tspan>. The key itself stays in the key store.</text>
  <text x="50" y="464" font-size="13" class="m">A Claude hook also stops Claude from printing a key or writing one into a file.</text>
</svg>
